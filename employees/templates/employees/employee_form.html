<!DOCTYPE html>
<html>
<head>
    <title>Employee Form</title>
</head>
<body>

<h1>
    {% if employee %}
        Edit Employee
    {% else %}
        Add Employee
    {% endif %}
</h1>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Username:</label><br>
    <input type="text" name="username"
           value="{{ employee.user.username|default:'' }}" required>
    <br><br>

    {% if not employee %}
    <label>Password:</label><br>
    <input type="password" name="password" required>
    <br><br>
    {% endif %}

    <label>First Name:</label><br>
    <input type="text" name="first_name"
           value="{{ employee.user.first_name|default:'' }}" required>
    <br><br>

    <label>Last Name:</label><br>
    <input type="text" name="last_name"
           value="{{ employee.user.last_name|default:'' }}" required>
    <br><br>

    <label>Email:</label><br>
    <input type="email" name="email"
           value="{{ employee.user.email|default:'' }}" required>
    <br><br>

    <label>Employee ID:</label><br>
    <input type="text" name="employee_id"
           value="{{ employee.employee_id|default:'' }}" required>
    <br><br>

    <label>Department:</label><br>
    <input type="text" name="department"
           value="{{ employee.department|default:'' }}" required>
    <br><br>

    <label>Designation:</label><br>
    <input type="text" name="designation"
           value="{{ employee.designation|default:'' }}" required>
    <br><br>

    <label>Date of Joining:</label><br>
    <input type="date" name="date_of_joining"
           value="{{ employee.date_of_joining|date:'Y-m-d' }}" required>
    <br><br>

    <button type="submit">Save Employee</button>
</form>

<br>
<a href="{% url 'employee_list' %}">Cancel</a>

</body>
</html>
